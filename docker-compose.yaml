
services:
  db:
    image: postgres:16-alpine
    container_name: ecommerce_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: ecommercedb
    volumes:
      - postgres_data_v3:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce_backend
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=ecommercedb;Username=admin;Password=password123
      - Jwt__Secret=Your_Super_Secret_JWT_Key_Which_Must_Be_Long_Enough_256_Bits
      - Jwt__Issuer=ECommerceStore
      - Jwt__Audience=ECommerceClients
    depends_on:
      - db
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce_frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: always

volumes:
  postgres_data_v3:
