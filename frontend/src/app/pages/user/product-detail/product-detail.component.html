<nav *ngIf="product" class="bg-[#020202] border-b border-white/5">
    <ol class="max-w-7xl mx-auto px-4 py-6 flex items-center space-x-4">
    <li><a routerLink="/" class="text-[10px] font-bold text-white/40 uppercase tracking-widest hover:text-white transition-colors">Archive</a></li>
    <li class="text-white/20 text-[10px]">/</li>
    <li><a [routerLink]="['/category', product.categoryId]" class="text-[10px] font-bold text-white/40 uppercase tracking-widest hover:text-white transition-colors">{{product.categoryName}}</a></li>
    <li class="text-white/20 text-[10px]">/</li>
    <li class="text-[10px] font-bold text-white uppercase tracking-widest truncate max-w-[150px]">{{product.title}}</li>
    </ol>
</nav>

<div class="bg-[#020202] min-h-screen pt-12 pb-32" *ngIf="product">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="lg:grid lg:grid-cols-12 lg:gap-x-16">
        <!-- Left: Image Gallery -->
        <div class="lg:col-span-12 xl:col-span-7 flex flex-col gap-6">
        <div class="aspect-[4/5] bg-[#1a1a1a] relative group overflow-hidden border border-white/5 rounded-2xl">
            <div #galleryContainer (scroll)="onScroll($event)" class="flex overflow-x-auto snap-x snap-mandatory scrollbar-hide h-full">
            <div *ngFor="let img of product.images" class="snap-start flex-none w-full h-full">
                <img [src]="getProxyUrl(img.url)" [alt]="product.title" class="w-full h-full object-cover">
            </div>
            </div>
            
            <!-- Gallery Navigation -->
            <div *ngIf="product.images.length > 1" class="absolute inset-x-4 top-1/2 -translate-y-1/2 flex justify-between pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-500">
            <button (click)="prevImage($event)" class="pointer-events-auto w-12 h-12 rounded-full bg-black/40 backdrop-blur-md border border-white/10 flex items-center justify-center text-white hover:bg-[#c5a059] hover:border-[#c5a059] hover:text-black transition-all group/btn">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
            </button>
            <button (click)="nextImage($event)" class="pointer-events-auto w-12 h-12 rounded-full bg-black/40 backdrop-blur-md border border-white/10 flex items-center justify-center text-white hover:bg-[#c5a059] hover:border-[#c5a059] hover:text-black transition-all group/btn">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
            </button>
            </div>

            <!-- Indicators -->
            <div *ngIf="product.images.length > 1" class="absolute bottom-8 left-1/2 -translate-x-1/2 flex gap-2">
            <div *ngFor="let img of product.images; let i = index" 
                    [class.w-8]="currentImageIndex === i" 
                    [class.bg-white]="currentImageIndex === i"
                    class="h-1 w-2 rounded-full bg-white/20 transition-all duration-500"></div>
            </div>
        </div>

        <!-- Thumbnail Grid -->
        <div class="grid grid-cols-5 gap-4" *ngIf="product.images.length > 1">
            <button *ngFor="let img of product.images; let i = index" 
                    (click)="scrollToImage(i)"
                    [class.border-[#c5a059]]="currentImageIndex === i"
                    class="aspect-square bg-[#1a1a1a] rounded-xl overflow-hidden border-2 border-transparent transition-all">
            <img [src]="getProxyUrl(img.url)" class="w-full h-full object-cover">
            </button>
        </div>
        </div>

        <!-- Right: Product Details -->
        <div class="lg:col-span-12 xl:col-span-5 mt-16 xl:mt-0 flex flex-col">
        <div class="sticky top-12">
            <div class="mb-12">
            <h1 class="text-6xl font-black text-white uppercase tracking-tighter leading-none mb-6">{{product.title}}</h1>
            <div class="flex items-baseline gap-4">
                <span class="text-4xl font-bold text-[#c5a059] tracking-tight">
                    {{ product.price > 0 ? (product.price | number) + ' TL' : 'FIYAT' }}
                </span>
            </div>
            </div>

            <!-- Size Selection -->
            <div *ngIf="product.sizes && product.sizes.length > 0" class="mb-12">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-[10px] font-bold text-white/40 uppercase tracking-[0.2em]">Select Size</h3>
            </div>
            <div class="grid grid-cols-4 gap-3">
                <button *ngFor="let size of product.sizes" 
                        type="button"
                        (click)="selectSize(size.name)" 
                        [class.border-[#c5a059]]="selectedSize === size.name" 
                        [class.text-white]="selectedSize === size.name" 
                        [class.bg-[#c5a059]/10]="selectedSize === size.name"
                        class="h-16 rounded-2xl border border-white/5 flex items-center justify-center text-sm font-bold text-white/40 hover:text-white hover:border-white/20 transition-all uppercase tracking-widest">
                {{size.name}}
                </button>
            </div>
            </div>

            <!-- Action Bar -->
            <div class="flex items-center gap-4 mb-8">
            <div class="flex items-center bg-[#1a1a1a] border border-white/5 h-16 rounded-2xl px-2">
                <button (click)="decrementQuantity()" class="w-12 h-12 flex items-center justify-center text-white/40 hover:text-white transition-colors">-</button>
                <span class="w-12 text-center text-white font-bold text-lg">{{quantity}}</span>
                <button (click)="incrementQuantity()" class="w-12 h-12 flex items-center justify-center text-white/40 hover:text-white transition-colors">+</button>
            </div>
            <button (click)="addToCart()" 
                    class="flex-1 bg-[#c5a059] hover:bg-[#d4b476] text-black h-16 flex items-center justify-center gap-3 font-black uppercase text-xs tracking-[0.2em] rounded-2xl transition-all shadow-xl shadow-[#c5a059]/10 active:scale-[0.98]">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>
                Add to Archive
            </button>
            </div>

            <!-- WhatsApp Direct -->
            <a [href]="whatsappLink" target="_blank" 
                class="w-full h-16 rounded-2xl border border-white/5 flex items-center justify-center gap-3 text-white/40 hover:text-white hover:bg-white/5 hover:border-white/10 transition-all uppercase text-[10px] font-bold tracking-[0.3em]">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
            Ask on WhatsApp
            </a>

            <div class="mt-12 p-8 rounded-3xl bg-[#1a1a1a]/50 border border-white/5">
            <h4 class="text-white font-bold text-sm uppercase tracking-widest mb-4">ARCHIVE NOTES</h4>
            <div class="prose prose-invert prose-sm">
                <p class="text-white/60 leading-relaxed">{{product.description}}</p>
            </div>
            </div>
        </div>
        </div>
    </div>
    </div>
</div>
