<nav *ngIf="product" class="bg-[#020202] border-b border-white/5">
  <div class="max-w-7xl mx-auto px-4 py-6">
    <ol class="flex items-center space-x-4">
      <li>
        <a routerLink="/" class="text-[10px] font-bold text-white/40 uppercase tracking-widest hover:text-white transition-colors">Archive</a>
      </li>
      <li class="text-white/20 text-[10px]">/</li>
      <li>
        <a [routerLink]="['/category', product.categoryId]" class="text-[10px] font-bold text-white/40 uppercase tracking-widest hover:text-white transition-colors">{{product.categoryName}}</a>
      </li>
      <li class="text-white/20 text-[10px]">/</li>
      <li class="text-[10px] font-bold text-white uppercase tracking-widest truncate max-w-[150px]">{{product.title}}</li>
    </ol>
  </div>
</nav>

<div class="bg-[#020202] min-h-screen pt-12 pb-32" *ngIf="product">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="lg:grid lg:grid-cols-12 lg:gap-x-16">
      
      <div class="lg:col-span-12 xl:col-span-7 flex flex-col gap-6">
        <div class="aspect-[4/5] bg-[#1a1a1a] relative group overflow-hidden border border-white/5 rounded-2xl">
          <div #galleryContainer (scroll)="onScroll($event)" class="flex overflow-x-auto snap-x snap-mandatory scrollbar-hide h-full">
            <div *ngFor="let img of product.images" class="snap-start flex-none w-full h-full">
              <img [src]="getProxyUrl(img.url)" [alt]="product.title" class="w-full h-full object-cover">
            </div>
          </div>
          
          <div *ngIf="product.images.length > 1" class="absolute inset-x-4 top-1/2 -translate-y-1/2 flex justify-between pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-500 font-bold">
            <button (click)="prevImage($event)" class="pointer-events-auto w-12 h-12 rounded-full bg-black/40 backdrop-blur-md border border-white/10 flex items-center justify-center text-white hover:bg-[#c5a059] transition-all text-xl">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
            </button>
            <button (click)="nextImage($event)" class="pointer-events-auto w-12 h-12 rounded-full bg-black/40 backdrop-blur-md border border-white/10 flex items-center justify-center text-white hover:bg-[#c5a059] transition-all text-xl">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
            </button>
          </div>

          <div *ngIf="product.images.length > 1" class="absolute bottom-6 left-1/2 -translate-x-1/2 flex gap-2">
            <div *ngFor="let img of product.images; let i = index" 
                 class="h-1 rounded-full transition-all duration-300"
                 [ngClass]="currentImageIndex === i ? 'w-8 bg-[#c5a059]' : 'w-2 bg-white/20'">
            </div>
          </div>
        </div>

        <div class="grid grid-cols-5 gap-4" *ngIf="product.images.length > 1">
          <button *ngFor="let img of product.images; let i = index" 
                  (click)="scrollToImage(i)"
                  [ngClass]="currentImageIndex === i ? 'border-[#c5a059]' : 'border-transparent'"
                  class="aspect-square bg-[#1a1a1a] rounded-xl overflow-hidden border-2 border-transparent transition-all hover:border-white/20">
            <img [src]="getProxyUrl(img.url)" class="w-full h-full object-cover">
          </button>
        </div>
      </div>

      <div class="lg:col-span-12 xl:col-span-5 mt-16 xl:mt-0 flex flex-col">
        <div class="sticky top-12">
          <div class="mb-12">
            <h1 class="text-6xl font-black text-white uppercase tracking-tighter leading-none mb-6">{{product.title}}</h1>
            <div class="flex items-baseline gap-4">
              <span class="text-4xl font-bold text-[#c5a059] tracking-tight">
                {{ product.price > 0 ? product.price + ' TL' : 'PRICE ON REQUEST' }}
              </span>
            </div>
          </div>

          <div *ngIf="product.sizes?.length" class="mb-12">
            <div class="flex items-center justify-between mb-6">
              <h3 class="text-[10px] font-bold text-white/40 uppercase tracking-[0.2em]">Select Size</h3>
              <div *ngIf="showSizeError" class="text-red-500 text-[10px] font-bold uppercase tracking-widest animate-pulse">Required</div>
            </div>
            <div class="grid grid-cols-4 gap-3">
              <button *ngFor="let size of product.sizes" 
                      type="button"
                      (click)="selectSize(size.name)" 
                      [ngClass]="selectedSize === size.name ? 'border-[#c5a059] text-white bg-[#c5a059]/10' : ''"
                      class="h-16 rounded-2xl border border-white/5 flex items-center justify-center text-sm font-bold text-white/40 hover:text-white hover:border-white/20 transition-all uppercase tracking-widest">
                {{size.name}}
              </button>
            </div>
          </div>

          <div class="flex items-center gap-4 mb-8">
            <div class="flex items-center bg-[#1a1a1a]/50 border border-white/5 h-16 rounded-2xl px-2">
              <button (click)="decrementQuantity()" class="w-12 h-12 flex items-center justify-center text-white/40 hover:text-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" /></svg>
              </button>
              <span class="w-12 text-center text-white font-black text-lg">{{quantity}}</span>
              <button (click)="incrementQuantity()" class="w-12 h-12 flex items-center justify-center text-white/40 hover:text-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
              </button>
            </div>
            <button (click)="addToCart()" 
                    class="flex-1 bg-[#c5a059] hover:bg-[#d4b476] text-black h-16 flex items-center justify-center gap-3 font-black uppercase text-xs tracking-[0.2em] rounded-2xl transition-all shadow-xl shadow-[#c5a059]/10">
              Sepete Ekle
            </button>
          </div>

          <a [href]="whatsappLink" target="_blank" 
             class="w-full h-16 rounded-2xl border border-white/5 flex items-center justify-center gap-3 text-white/40 hover:text-white hover:bg-white/5 transition-all uppercase text-[10px] font-bold tracking-[0.3em] mb-12">
            Ask on WhatsApp
          </a>

          <div class="mt-12 p-8 rounded-3xl bg-[#1a1a1a]/50 border border-white/5">
            <h3 class="text-white font-bold text-sm uppercase tracking-widest mb-4">ARCHIVE NOTES</h3>
            <div class="prose prose-invert prose-sm max-w-none">
              <p class="text-white/60 leading-relaxed">{{product.description}}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
