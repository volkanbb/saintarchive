<div class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
  <div class="bg-neutral-900 border border-white/10 rounded-3xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl animate-zoom-in">
    <!-- Header -->
    <div class="p-8 border-b border-white/5 flex items-center justify-between">
      <div>
        <h2 class="text-2xl font-display font-black text-white uppercase tracking-wider">Bulk Edit Category Details</h2>
        <p class="text-white/40 text-xs mt-1 font-bold uppercase tracking-widest">{{selectedCategories.length}} Items Selected</p>
      </div>
      <button (click)="close.emit()" class="p-2 text-white/40 hover:text-white transition-colors bg-white/5 rounded-full">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Content -->
    <div class="flex-1 overflow-y-auto p-8 scrollbar-hide">
      <div class="space-y-6">
        <div *ngFor="let item of editableItems" class="p-6 bg-white/5 rounded-3xl border border-white/5 group">
          <div class="flex gap-6">
            <!-- Visual Preview -->
            <div class="w-32 h-32 rounded-2xl bg-black overflow-hidden flex-shrink-0 border border-white/10 flex items-center justify-center">
              <img *ngIf="item.imageUrl" [src]="getProxyUrl(item.imageUrl)" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity" alt="">
              <svg *ngIf="!item.imageUrl" class="w-12 h-12 text-white/10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
            </div>
            
            <!-- Fields -->
            <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4">
              <!-- Name -->
              <div>
                <label class="text-[10px] font-black text-brand-500 uppercase tracking-widest mb-2 block">Category Name</label>
                <input [(ngModel)]="item.name" class="w-full bg-black/40 border border-white/5 rounded-xl px-4 py-3 text-sm text-white focus:ring-1 focus:ring-brand-500 outline-none">
              </div>
              
              <!-- Image URL -->
              <div>
                <label class="text-[10px] font-black text-brand-500 uppercase tracking-widest mb-2 block">Image URL</label>
                <input [(ngModel)]="item.imageUrl" class="w-full bg-black/40 border border-white/5 rounded-xl px-4 py-3 text-sm text-white focus:ring-1 focus:ring-brand-500 outline-none">
              </div>

              <!-- Description -->
              <div>
                <label class="text-[10px] font-black text-brand-500 uppercase tracking-widest mb-2 block">Description</label>
                <input [(ngModel)]="item.description" class="w-full bg-black/40 border border-white/5 rounded-xl px-4 py-3 text-sm text-white focus:ring-1 focus:ring-brand-500 outline-none">
              </div>

              <!-- Sub-categories -->
              <div>
                <label class="text-[10px] font-black text-brand-500 uppercase tracking-widest mb-2 block">Sub-categories</label>
                <input [(ngModel)]="item.subCategoryNamesStr" class="w-full bg-black/40 border border-white/5 rounded-xl px-4 py-3 text-sm text-white focus:ring-1 focus:ring-brand-500 outline-none" placeholder="Sub1, Sub2, Sub3...">
              </div>

              <!-- Navbar Settings -->
              <div class="md:col-span-2 p-4 bg-white/5 rounded-2xl flex items-center justify-between border border-white/5">
                <div>
                  <span class="text-xs font-black text-white uppercase block">Show in Navbar</span>
                  <span class="text-[9px] text-white/40 uppercase tracking-widest">Display between Collection and Contact</span>
                </div>
                <div class="relative inline-flex items-center cursor-pointer" (click)="item.showInNavbar = !item.showInNavbar">
                <div class="w-11 h-6 rounded-full transition-colors duration-200" [ngClass]="item.showInNavbar ? 'bg-brand-600' : 'bg-white/10'"></div>
                  <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform duration-200" [style.transform]="item.showInNavbar ? 'translateX(20px)' : 'translateX(0)'"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="p-8 border-t border-white/5 bg-black/20 flex items-center justify-between">
      <button (click)="close.emit()" class="px-8 py-4 rounded-xl font-bold text-white/40 uppercase text-xs hover:text-white transition-colors">Cancel</button>
      <button (click)="save()" [disabled]="isSaving" class="px-10 py-4 bg-brand-600 text-white rounded-xl font-black text-xs uppercase hover:bg-brand-700 transition-all">
        {{ isSaving ? 'Saving Changes...' : 'Save All Changes' }}
      </button>
    </div>
  </div>
</div>
